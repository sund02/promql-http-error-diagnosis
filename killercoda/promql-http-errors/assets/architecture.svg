<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">PromQL HTTP error diagnosis architecture</title>
  <desc id="description">Traffic flows from a generator to the app. Prometheus scrapes the app and serves PromQL results to the learner's browser.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="1192" height="352" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Metrics-based HTTP error diagnosis</text>

  <line x1="250" y1="230" x2="330" y2="230" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="290" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">HTTP requests</text>

  <line x1="700" y1="230" x2="590" y2="230" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="645" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">
    <tspan x="645" dy="0">scrape /metrics</tspan>
    <tspan x="645" dy="20">every 5s</tspan>
  </text>

  <line x1="920" y1="230" x2="1000" y2="230" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="960" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#334155">
    <tspan x="960" dy="0">PromQL queries</tspan>
    <tspan x="960" dy="20">and graphs</tspan>
  </text>

  <rect x="30" y="170" width="220" height="130" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="140" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0c4a6e">Traffic generator</text>
  <text x="140" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">8 req/s /orders</text>
  <text x="140" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">2 req/s /payments</text>

  <rect x="330" y="160" width="260" height="150" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="460" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">App :8000</text>
  <text x="460" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">/orders, /payments, /metrics</text>
  <text x="460" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">http_requests_total</text>
  <text x="460" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">{endpoint, status}</text>

  <rect x="700" y="170" width="220" height="130" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="810" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#78350f">Prometheus :9090</text>
  <text x="810" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">stores time series</text>
  <text x="810" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">evaluates PromQL</text>

  <rect x="1000" y="170" width="170" height="130" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="1085" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#581c87">Learner's browser</text>
  <text x="1085" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Prometheus UI</text>
</svg>
